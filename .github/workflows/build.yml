name: Build AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools build-essential

      - name: Lint
        run: |
          pip install pyflakes
          python3 -m pyflakes src/flsetup/*.py

      - name: Build AppImage
        run: bash scripts/build.sh

      - name: Smoke test
        run: APPIMAGE_EXTRACT_AND_RUN=1 ./dist/FL-Studio-Setup-x86_64.AppImage --version

      - uses: actions/upload-artifact@v4
        with:
          name: FL-Studio-Setup-x86_64.AppImage
          path: dist/FL-Studio-Setup-x86_64.AppImage

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FL-Studio-Setup-x86_64.AppImage
          generate_release_notes: true
